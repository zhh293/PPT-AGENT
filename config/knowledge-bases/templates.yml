name: templates
description: Template profiles indexed from templates/index.json and template meta files.
sources:
  - path: templates/index.json
    type: ppt-template-meta
chunking:
  strategy: json-object
  max_tokens: 800
  overlap_tokens: 0
  contextual_enrichment: true
retrieval:
  methods: [bm25, metadata-filter]
  sparse:
    backend: local-bm25
    top_k: 5
refresh:
  mode: manual
  rebuild_on_schema_change: true
