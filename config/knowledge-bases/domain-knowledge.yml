name: domain-knowledge
description: Local domain knowledge and source materials for storyline grounding.
sources:
  - path: specs/001-ppt-generation-agent/spec.md
    type: markdown
chunking:
  strategy: markdown-heading
  max_tokens: 1000
  overlap_tokens: 100
  contextual_enrichment: true
retrieval:
  methods: [bm25]
  sparse:
    backend: local-bm25
    top_k: 5
refresh:
  mode: manual
  rebuild_on_schema_change: true
